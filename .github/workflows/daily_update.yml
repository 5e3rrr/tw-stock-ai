name: Daily Stock Analysis Update

on:
  schedule:
    # 台灣時間週一至週五 14:05 (UTC 06:05) 自動執行
    - cron: '5 6 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁手動點擊測試

jobs:
  update-stock-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依套件
        run: |
          pip install requests

      - name: 執行資料抓取與 AI 分析
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python app.py

      - name: 提交並推送更新資料
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add market_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update market data [skip ci]" && git push)