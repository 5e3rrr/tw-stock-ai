name: Daily 08:00 Pre-Market Update

on:
  schedule:
    - cron: '0 0 * * 1-5'
  workflow_dispatch:

jobs:
  premarket-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 簽出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 3.11 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依套件
        run: |
          pip install requests yfinance

      - name: 執行盤前資料抓取與 Gemini 戰報分析
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python update_premarket.py

      - name: 提交並推送盤前資料至 GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add premarket_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update 08:00 premarket data [skip ci]" && git pull --rebase origin main && git push origin main)